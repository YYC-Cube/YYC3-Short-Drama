# pnpm 11+ 配置（构建脚本白名单）
packages:
  - "."

# 供应链策略：关闭 minimumReleaseAge（默认拒绝发布不足 24h 的包版本）。
# 理由：CI 固定使用 --frozen-lockfile，锁文件本身即版本审查边界；
# 该策略会让"依赖整理当天发布的新版本"阻塞所有 CI（regenerate@1.5.0 事件，2026-10-05）。
# 团队化后如需收紧，可移除此行并配合 PR 评审使用。
minimumReleaseAge: 0

# 传递依赖安全覆盖：undici 经 ai SDK 链引入（全栈轨专用，静态站不运行），
# 强制 ≥7.29.1 消除 DoS/TLS 校验两个 HIGH（GHSA 公告，2026-10-05 终审整改）
overrides:
  undici: ^7.29.1

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  sharp: true
  unrs-resolver: true
