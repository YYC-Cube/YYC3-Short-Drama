# ============================================================================
# YYC³ 短剧平台 - GitHub Pages 自动化部署流水线
# 基于: 五维度驱动框架 | 五高架构标准
# 版本: 2.1.0 | 更新: 2026-10-05
# 变更: ①Node 18→22 / pnpm 9→11（Next.js 16 要求 ≥20.9）
#       ②lint/tsc/test 全部转为硬门禁（移除 continue-on-error）
#       ③新增构建产物冒烟检查（路由存在性/内部路由不泄漏/体积/静态纯度）
# ============================================================================

name: CI/CD - GitHub Pages Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "部署环境"
        required: false
        default: "production"
        type: choice
        options:
          - production
          - preview

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

# 供应链加固：全部 actions 固定至 commit SHA（升级时更新 SHA 并核对变更）
# 顶层权限最小化：默认只读，需要写入的 job 单独声明

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # Job 1: 质量检测与构建验证
  # ==========================================================================
  quality-check:
    name: 📋 质量检测与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ------------------------------------------------------------------
      # Step 1: 环境准备
      # ------------------------------------------------------------------
      - name: 📥 检出代码仓库
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: 🔧 配置 pnpm 包管理器
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 🟢 设置 Node.js 环境
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # ------------------------------------------------------------------
      # Step 2: 依赖安装（使用冻结锁文件确保一致性）
      # ------------------------------------------------------------------
      - name: 📦 安装项目依赖
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------
      # Step 3: 代码质量检查（硬门禁）
      # ------------------------------------------------------------------
      - name: 🔍 运行 ESLint 检查
        run: pnpm run lint

      # ------------------------------------------------------------------
      # Step 4: TypeScript 类型检查（硬门禁）
      # ------------------------------------------------------------------
      - name: 📝 TypeScript 类型检查
        run: pnpm run type-check

      # ------------------------------------------------------------------
      # Step 5: 单元测试 + 覆盖率棘轮阈值（硬门禁）
      # ------------------------------------------------------------------
      - name: 🧪 运行单元测试（含覆盖率门禁）
        run: pnpm test:coverage

      # ------------------------------------------------------------------
      # Step 6: 静态站点构建（核心步骤）
      # ------------------------------------------------------------------
      - name: 🏗️ 构建静态导出 (Next.js Export)
        id: build
        run: |
          echo "=========================================="
          echo "🎯 开始构建 YYC³ 短剧平台静态站点"
          echo "📅 构建时间: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "🌿 分支: ${GITHUB_REF_NAME}"
          echo "=========================================="

          pnpm run build

          if [ $? -eq 0 ]; then
            echo "✅ 构建成功完成！"
            echo "build_status=success" >> $GITHUB_OUTPUT

            # 输出构建产物信息
            echo ""
            echo "📊 构建产物统计:"
            du -sh ./out/
            ls -lh ./out/ | head -10
          else
            echo "❌ 构建失败！"
            echo "build_status=failure" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ------------------------------------------------------------------
      # Step 6.5: 构建产物冒烟检查（TC-01~07 自动化：路由/泄漏/体积/纯度）
      # ------------------------------------------------------------------
      - name: 🚦 构建产物冒烟检查
        run: node scripts/smoke-build.mjs out

      # ------------------------------------------------------------------
      # Step 7: 上传构建产物（供后续Job使用）
      # ------------------------------------------------------------------
      - name: 📤 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: static-site-${{ github.sha }}
          path: ./out/
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # Job 2: GitHub Pages 自动部署
  # ==========================================================================
  deploy-github-pages:
    name: 🚀 部署到 GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ------------------------------------------------------------------
      # Step 1: 下载构建产物
      # ------------------------------------------------------------------
      - name: 📥 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: static-site-${{ github.sha }}
          path: ./deploy

      # ------------------------------------------------------------------
      # Step 2: 配置 GitHub Pages
      # ------------------------------------------------------------------
      - name: ⚙️ 配置 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      # ------------------------------------------------------------------
      # Step 3: 上传到 GitHub Pages
      # ------------------------------------------------------------------
      - name: 📤 上传到 GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: ./deploy

      # ------------------------------------------------------------------
      # Step 4: 执行部署
      # ------------------------------------------------------------------
      - name: 🎯 执行部署
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  # ==========================================================================
  # Job 3: PR预览部署（可选）
  # ==========================================================================
  deploy-preview:
    name: 👁️ PR 预览部署
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-check
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      issues: write

    steps:
      - name: 📥 下载构建产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: static-site-${{ github.sha }}
          path: ./preview

      - name: 💬 评论PR预览链接
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        # 评论属通知性质：仓库 Settings→Actions→Workflow permissions 为只读时 GITHUB_TOKEN 无法发评论，
        # 失败不阻断门禁（Owner 将仓库设置改为 Read and write 后自动恢复）
        continue-on-error: true
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const comment = `## 🎉 构建与质量门禁通过！

            ### ✅ 质量检测结果
            - **状态**: lint / 类型检查 / 单元测试 / 构建 / 冒烟检查 全部通过 ✅
            - **分支**: \`${context.ref}\`
            - **提交**: \`${context.sha.substring(0, 7)}\`

            ### 📝 下一步
            合并此PR后将自动部署到生产环境: https://drama.yyc3.top
            `;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

  # ==========================================================================
  # Job 4: 部署后通知与监控
  # ==========================================================================
  post-deploy:
    name: 📊 部署后监控
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy-github-pages]
    # PR 事件下部署任务被跳过，本任务也应跳过（修复：此前 always() 导致每次 PR 运行必红）
    if: always() && needs.deploy-github-pages.result != 'skipped'

    steps:
      - name: 📈 生成部署报告
        run: |
          echo "## 📊 部署报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 详情 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| **时间** | $(date '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| **触发者** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **分支** | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **提交** | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **域名** | [drama.yyc3.top](https://drama.yyc3.top) |" >> $GITHUB_STEP_SUMMARY
          echo "| **状态** | ${{ needs.deploy-github-pages.result == 'success' && '✅ 成功' || '❌ 失败' }} |" >> $GITHUB_STEP_SUMMARY

      - name: 🔔 部署状态通知（可扩展）
        run: |
          if [ "${{ needs.deploy-github-pages.result }}" == "success" ]; then
            echo "✅ 部署成功！网站已上线: https://drama.yyc3.top"
          else
            echo "❌ 部署失败，请检查日志"
            exit 1
          fi
